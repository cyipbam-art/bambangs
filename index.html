V.area=()=>{if(!S.user)return H('Area Siswa & Klien','Masuk dengan akun dari Admin.')+lf('usr','Username','','siswa / siswa123');
const m=S.d.materi.filter(x=>['semua',S.user.peran].includes(x.untukPeran||'semua'));
return `<div class="row">${H('Halo, '+esc(S.user.nama),'Peran: '+esc(S.user.peran))}<a class="btn b2" data-out="u">Keluar</a></div><h4>Materi</h4>`+(m.length?`<div class="grid">${m.map(x=>`<div class="card"><h4>${esc(x.judul)}</h4><p class="mu">${esc(x.deskripsi)}</p>${x.tautan?`<a class="lk" href="${u(x.tautan)}" target="_blank" rel="noopener">Buka →</a>`:''}</div>`).join('')}</div>`:E('materi'))+`<h4>Tulis Testimoni</h4><form data-f="tes" class="card fm"><input name="web" tabindex="-1" autocomplete="off" aria-hidden="true" style="position:absolute;left:-9999px"><textarea name="isi" placeholder="Ceritakan pengalaman Anda..." maxlength="500" required></textarea><button class="btn b1">Kirim Testimoni</button></form><p class="pv">Testimoni akan tampil di website setelah disetujui Admin.</p>`};
const crud=c=>{const[n,tk]=SC[c],l=S.a[c]||[];return `<div class="row"><h4>${n} (${l.length})</h4>${c=='pesan'?'':`<a class="btn b1" data-new="${c}">+ Tambah</a>`}</div>`+(l.length?l.map(x=>`<div class="card li"><span>${esc(x[tk]||x.id)} <small class="mu">${c=='akun'?esc(x.peran):c=='testimoni'&&x.tampil===false?'(menunggu persetujuan)':''}</small></span><span><a data-ed="${c}|${x.id}">Ubah</a><a data-del="${c}|${x.id}" class="dg">Hapus</a></span></div>`).join(''):E('data'))};
V.admin=()=>{if(!S.admin)return H('Admin','Masuk dengan akun Firebase Authentication.')+lf('adm','Email','','admin@Bamdigital / admin123');
return `<div class="row">${H('Dashboard Admin','Masuk sebagai '+esc(who())+'. Kelola seluruh konten.')}<a class="btn b2" data-out="a">Keluar</a></div><div class="chips">${['profil',...Object.keys(SC)].map(k=>`<a data-tab="${k}" class="${S.tab==k?'on':''}">${k=='profil'?'Profil':SC[k][0]}</a>`).join('')}</div>`+(S.tab=='profil'?`<form data-f="prof" class="card fm">${PF.map(([k,l,t])=>fld(k,l,t,S.p[k])).join('')}${DH}<button class="btn b1">Simpan Profil</button></form>`:crud(S.tab))};
const modal=()=>{const{c,id,v}=S.m;return `<div class="ov"><form data-f="crud" class="card fm mo"><h4>${id?'Ubah':'Tambah'} ${SC[c][0]}</h4>${SC[c][2].map(([k,l,t,o])=>fld(k,l,t,v[k],o)).join('')}${c=='karya'||c=='testimoni'?DH:''}<div class="row"><a class="btn b2" data-x>Batal</a><button class="btn b1">Simpan</button></div></form></div>`};
const nav=()=>`<aside><div class="logo">${S.p.logoUrl?`<img class="lg" src="${im(S.p.logoUrl)}" alt="Bamdigital" referrerpolicy="no-referrer" data-fb="Bamdigital">`:'BAMS<i>.id</i><small>— Guru DKV —</small>'}</div><nav>${N.map(([k,t,i])=>`<a data-go="${k}" class="${S.v==k?'on':''}">${ic(i)}${t}</a>`).join('')}</nav><a class="sa" data-thm>${ic(TH()=='light'?'moon':'sun')}${TH()=='light'?'Mode Gelap':'Mode Terang'}</a><a class="sa" data-go="area">${ic('user')}Area Siswa &amp; Klien</a><a class="sa ad" data-go="admin">${ic('lock')}Admin</a><small>© ${new Date().getFullYear()} Bamdigital</small></aside>`;
const bot=()=>`<nav class="bot">${['beranda','karya','keahlian','testimoni'].map(k=>{const n=N.find(x=>x[0]==k);return `<a data-go="${k}" class="${S.v==k?'on':''}">${ic(n[2])}<span>${n[1]}</span></a>`}).join('')}<a data-more class="${S.more?'on':''}">${ic('more')}<span>Lainnya</span></a></nav>${S.more?`<div class="sheet">${[['jejak','Perjalanan Pendidikan & Karier'],['kontak','Kontak'],['area','Area Siswa & Klien'],['admin','Admin']].map(([k,t])=>`<a data-go="${k}">${esc(t)}</a>`).join('')}<a data-thm>${TH()=='light'?'Mode Gelap':'Mode Terang'}</a></div>`:''}`;
const FT=()=>`<footer class="ft"><div class="fl">${S.p.logoUrl?`<img class="flg" src="${im(S.p.logoUrl)}" alt="Bamdigital" referrerpolicy="no-referrer" data-fb="B">`:'<span class="lg">B</span>'}<span>© ${new Date().getFullYear()} <b>Bamdigital</b> — Portofolio Digital</span></div><nav><a data-top>Kembali ke atas</a><a data-go="area">Area Siswa</a></nav></footer>`,ER=()=>S.err?'<div class="card em" style="margin-bottom:16px">Sebagian data gagal dimuat. Periksa koneksi atau Security Rules. <a class="lk" data-rd>Muat ulang</a></div>':'';
const main=()=>L.includes(S.v)?ER()+L.map(k=>`<section class="sec" id="s-${k}">${V[k]()}</section>`).join(''):'<a class="lk" data-go="beranda" style="margin-bottom:16px">← Kembali ke Beranda</a>'+V[S.v]();
const MH=()=>`<div class="mh">${S.p.logoUrl?`<img class="mlg" src="${im(S.p.logoUrl)}" alt="Bamdigital" referrerpolicy="no-referrer" data-fb="Bamdigital">`:'<span class="mt">BAMS<i>.id</i></span>'}</div>`;
const FV=document.querySelector('link[rel=icon]'),FV0=FV?[FV.getAttribute('href'),FV.getAttribute('type')]:0;
const fav=()=>{if(!FV)return;const fs=S.p.faviconUrl||S.p.logoUrl,x=fs?im(fs).replace(/&amp;/g,'&'):'';if(x&&x!='#'){FV.removeAttribute('type');FV.setAttribute('href',x)}else{FV.setAttribute('href',FV0[0]);if(FV0[1])FV.setAttribute('type',FV0[1])}};
let RV;const rvInit=()=>{RV?.disconnect();if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;const a=$('#app'),h=a.clientHeight;
RV=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;const t=e.target;RV.unobserve(t);t.classList.add('in');setTimeout(()=>t.classList.remove('rv','in'),1700)}),{root:a,threshold:.08,rootMargin:'0px 0px -5% 0px'});
document.querySelectorAll('.sec:not(#s-beranda),.ft').forEach(sec=>{const l=sec.matches('.ft')?[sec]:[...sec.querySelectorAll(':scope>*,.tl>*,.grid>*,.kt>*')].filter(e=>!e.matches('.grid,.tl,.kt'));
l.forEach(e=>{if(e.getBoundingClientRect().top<h)return;const i=[...e.parentElement.children].indexOf(e);e.style.setProperty('--d',Math.min(i,6)*.09+'s');e.classList.add('rv');RV.observe(e)})})};
const render=()=>{const a=$('#app'),y=a.scrollTop;a.innerHTML=nav()+`<main>${MH()}${main()}${FT()}</main>`+bot()+`<a class="tgl" data-thm aria-label="Ganti tema">${ic(TH()=='light'?'moon':'sun')}</a>`+(S.m?modal():'')+(S.vw?viewer():'')+(IS_PREVIEW?'<div class="pvb">MODE PREVIEW · data contoh, tidak tersambung Firebase</div>':'');a.scrollTop=y;anim();rvInit();fav()};
const tab=async t=>{S.tab=t;if(SC[t])S.a[t]=await D.list(t);render()};
document.addEventListener('click',async e=>{const t=e.target.closest('[data-go],[data-cat],[data-tab],[data-new],[data-ed],[data-del],[data-x],[data-out],[data-more],[data-vw],[data-vt],[data-dev],[data-vx],[data-rl],[data-top],[data-rd],[data-thm]');if(!t)return;const d=t.dataset;
try{if('top'in d){$('#app').scrollTo({top:0,behavior:'smooth'});return}
else if('go'in d){const k=d.go,was=L.includes(S.v);S.more=0;if(L.includes(k)){if(!was)$('#app').scrollTop=0;S.v=k;render();$('#s-'+k)?.scrollIntoView({behavior:was?'smooth':'auto'});return}S.v=k;$('#app').scrollTop=0;if(k=='admin'&&S.admin)return tab(S.tab)}
else if('more'in d)S.more=S.more?0:1;else if('cat'in d)S.cat=d.cat;else if('tab'in d)return tab(d.tab);
else if('new'in d)S.m={c:d.new,v:{}};else if('x'in d)S.m=null;else if('vw'in d){const[i,t]=d.vw.split('|');S.vw={id:i,tab:t,dev:'desktop'}}else if('vt'in d)S.vw.tab=d.vt;else if('dev'in d)S.vw.dev=d.dev;else if('vx'in d)S.vw=null;else if('rl'in d){const f=$('.fw iframe');if(f)f.src=f.src;return}else if('rd'in d){await load()}else if('thm'in d){setTheme(TH()=='light'?'dark':'light',1)}
else if('ed'in d){const[c,id]=d.ed.split('|');S.m={c,id,v:S.a[c].find(x=>x.id==id)}}
else if('del'in d){const[c,id]=d.del.split('|');if(!confirm('Hapus data ini?'))return;await D.del(c,id);await load();return tab(c)}
else if('out'in d){if(d.out=='a'){await signOut();S.admin=0}else S.user=null}
render()}catch(er){toast(emsg(er))}});
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target,k=f.dataset.f,o=Object.fromEntries(new FormData(f));
try{
if(k=='adm'){try{await signIn(o.e,o.p)}catch{throw Error('Login admin gagal')}S.admin=1;await tab('profil')}
else if(k=='usr'){const id=o.u.trim().toLowerCase(),x=await D.get('akun',await kid(id,o.p));if(!x||x.aktif===false||x.username!==id)throw Error('Username atau password salah');S.user={...x,id};render()}
else if(k=='tes'){if(o.web)return;cd();await D.add('testimoni',{nama:S.user.nama,peran:S.user.peran,isi:o.isi,fotoUrl:'',username:S.user.username,tampil:false,dibuatPada:now()});f.reset();await load();render();toast('Terima kasih! Testimoni menunggu persetujuan Admin')}
else if(k=='kon'){if(o.web)return;cd();await D.add('pesan',{nama:o.nama,kontak:o.kontak,isi:o.isi,dibaca:false,dibuatPada:now()});f.reset();toast('Pesan terkirim')}
else if(k=='prof'){o.tahunMengajar=Number(o.tahunMengajar||0);o.siswaDibimbing=Number(o.siswaDibimbing||0);await D.set('settings','profil',o);S.p={...S.p,...o};render();toast('Profil tersimpan')}
else if(k=='crud'){const{c,id,v}=S.m,d={};for(const[n,,t]of SC[c][2]){if(t=='b')d[n]=f.elements[n].checked;else if(t=='n')d[n]=Number(o[n]||0);else if(t!='p')d[n]=o[n]}
 if(c=='akun'){const uid=String(d.username).trim().toLowerCase();d.username=uid;if(o.password){const nid=await kid(uid,o.password);await D.set(c,nid,d);if(id&&id!=nid)await D.del(c,id)}else if(id){if(v.username!=uid)throw Error('Mengubah username wajib mengisi password baru');await D.set(c,id,d)}else throw Error('Password wajib diisi')}
 else if(id)await D.set(c,id,d);else{d.dibuatPada=now();await D.add(c,d)}
 S.m=null;await load();await tab(c);toast('Tersimpan')}
}catch(er){toast(emsg(er))}});
document.addEventListener('keydown',e=>{if(e.key=='Escape'&&S.vw){S.vw=null;render()}});
const spy=()=>{if(!L.includes(S.v)||S.vw)return;const a=$('#app'),y=a.scrollTop+140;let c='beranda';for(const k of L){const e=$('#s-'+k);if(e&&e.offsetTop<=y)c=k}if(a.scrollTop+a.clientHeight>=a.scrollHeight-4)c='kontak';if(c!=S.v){S.v=c;document.querySelectorAll('aside nav a,.bot a').forEach(x=>x.classList.toggle('on',x.dataset.go==c))}};
$('#app').addEventListener('scroll',spy,{passive:true});
setTheme('dark');
S.admin=await cur()?1:0;await load();render();
</script></body></html>
